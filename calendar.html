<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>TMK Agency — Calendario</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family:Poppins; }

body {
  min-height:100vh; min-height:100dvh;
  background:linear-gradient(135deg,#050505,#0e0e0e);
  color:white;
}

/* TOP BAR */
.topBar {
  height:60px; background:#0f0f0f;
  border-bottom:1px solid #1f1f1f;
  display:flex; align-items:center;
  justify-content:space-between; padding:0 20px;
  position:sticky; top:0; z-index:100;
}
.hamburgerBtn {
  display:flex; flex-direction:column;
  justify-content:space-between;
  width:26px; height:18px; cursor:pointer;
  padding:0; background:none; border:none; flex-shrink:0;
}
.hamburgerBtn span {
  display:block; height:2px; width:100%;
  background:#d4af37; border-radius:2px; transition:0.3s;
}
.hamburgerBtn:hover span { background:#f3d27a; }
.topTitle {
  position:absolute; left:50%; transform:translateX(-50%);
  color:#d4af37; font-weight:600; font-size:15px; white-space:nowrap;
}
.backBtn {
  background:none; border:1px solid #2a2a2a; color:#888;
  padding:6px 14px; border-radius:6px; cursor:pointer;
  font-family:Poppins; font-size:13px; transition:0.2s; flex-shrink:0;
}
.backBtn:hover { border-color:#d4af37; color:#d4af37; }

/* CALENDAR */
.calendarWrapper { max-width:900px; margin:40px auto; padding:0 20px 60px; }
.monthHeader {
  display:flex; align-items:center;
  justify-content:space-between; margin-bottom:30px;
}
.monthTitle { font-size:22px; font-weight:600; color:#d4af37; text-transform:capitalize; }
.navBtn {
  background:#1a1a1a; border:1px solid #2a2a2a; color:#ccc;
  width:38px; height:38px; border-radius:8px; cursor:pointer;
  font-size:16px; display:flex; align-items:center; justify-content:center; transition:0.2s;
}
.navBtn:hover { border-color:#d4af37; color:#d4af37; }
.weekDays {
  display:grid; grid-template-columns:repeat(7,1fr);
  gap:6px; margin-bottom:8px;
}
.weekDay {
  text-align:center; font-size:12px; color:#666;
  text-transform:uppercase; letter-spacing:1px; padding:6px 0;
}
.daysGrid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
.dayCell {
  min-height:90px; background:#111; border:1px solid #1e1e1e;
  border-radius:8px; padding:8px; cursor:pointer; transition:0.15s;
  display:flex; flex-direction:column; gap:4px; position:relative;
}
.dayCell:hover { border-color:#d4af37; background:#181808; }
.dayCell.today { border-color:#d4af37; background:#181505; }
.dayCell.today .dayNum {
  background:#d4af37; color:black; border-radius:50%;
  width:24px; height:24px; display:flex;
  align-items:center; justify-content:center;
}
.dayNum { font-size:13px; font-weight:600; color:#ccc; line-height:1; }
.dayCell.other-month .dayNum { color:#333; }
.eventDot {
  font-size:11px; background:rgba(212,175,55,0.15);
  border-left:2px solid #d4af37; color:#d4af37;
  padding:2px 5px; border-radius:3px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;
}

/* OVERLAY */
.overlay {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,0.65); z-index:3500;
}
.overlay.active { display:block; }

/* =====================
   DAY POPUP
===================== */
.dayPopupOverlay {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,0.8); z-index:4000;
  justify-content:center; align-items:center; padding:20px;
}
.dayPopupOverlay.active { display:flex; }

.dayPopup {
  background:#111; border:1px solid #2a2a2a;
  border-radius:14px; width:100%; max-width:440px;
  max-height:85vh; display:flex; flex-direction:column;
  overflow:hidden;
}

.dayPopupHeader {
  display:flex; justify-content:space-between; align-items:center;
  padding:18px 20px; border-bottom:1px solid #222;
  flex-shrink:0;
}
.dayPopupTitle {
  font-weight:600; color:#d4af37; font-size:15px;
  text-transform:capitalize;
}
.dayPopupActions { display:flex; gap:8px; align-items:center; }

.btnAddEvent {
  background:linear-gradient(135deg,#d4af37,#f3d27a);
  border:none; color:black; font-weight:700;
  width:34px; height:34px; border-radius:8px;
  cursor:pointer; font-size:20px; display:flex;
  align-items:center; justify-content:center;
  transition:0.2s; flex-shrink:0; line-height:1;
}
.btnAddEvent:hover { opacity:0.85; transform:scale(1.05); }

.btnClosePopup {
  background:none; border:1px solid #444; color:#aaa;
  padding:5px 12px; border-radius:6px; cursor:pointer;
  font-size:13px; font-family:Poppins; transition:0.2s;
}
.btnClosePopup:hover { border-color:#d4af37; color:#d4af37; }

.dayPopupBody {
  overflow-y:auto; padding:16px; flex:1;
  display:flex; flex-direction:column; gap:10px;
}

.noEventsMsg {
  text-align:center; color:#555; font-size:13px;
  padding:30px 0;
}

/* Event card in day popup */
.eventCard {
  background:#1a1a1a; border:1px solid #2a2a2a;
  border-radius:10px; padding:12px 14px;
  cursor:pointer; transition:0.2s;
  border-left:3px solid #d4af37;
}
.eventCard:hover { border-color:#d4af37; background:#1f1f0f; }
.eventCardTitle {
  font-size:14px; font-weight:600; color:#fff; margin-bottom:4px;
}
.eventCardMeta {
  display:flex; gap:10px; align-items:center; flex-wrap:wrap;
}
.eventCardTime {
  font-size:11px; color:#888;
  display:flex; align-items:center; gap:4px;
}
.eventCardAudience {
  font-size:11px; padding:2px 8px; border-radius:10px;
  background:rgba(212,175,55,0.12); color:#d4af37;
}

/* =====================
   EVENT DETAIL MODAL
===================== */
.eventDetailOverlay {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,0.85); z-index:5000;
  justify-content:center; align-items:center; padding:20px;
}
.eventDetailOverlay.active { display:flex; }

.eventDetail {
  background:#111; border:1px solid #2a2a2a;
  border-radius:14px; width:100%; max-width:420px;
  padding:24px; display:flex; flex-direction:column; gap:14px;
}
.eventDetailHeader {
  display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
}
.eventDetailTitle {
  font-size:17px; font-weight:600; color:#d4af37; flex:1; line-height:1.3;
}
.eventDetailActions { display:flex; gap:8px; flex-shrink:0; }
.btnDetailEdit {
  background:#1e1e1e; border:1px solid #2a2a2a; color:#ccc;
  padding:6px 12px; border-radius:6px; cursor:pointer;
  font-size:12px; font-family:Poppins; transition:0.2s;
}
.btnDetailEdit:hover { border-color:#d4af37; color:#d4af37; }
.btnDetailDelete {
  background:rgba(192,57,43,0.12); border:1px solid #c0392b;
  color:#e74c3c; padding:6px 12px; border-radius:6px;
  cursor:pointer; font-size:12px; font-family:Poppins; transition:0.2s;
}
.btnDetailDelete:hover { background:rgba(192,57,43,0.3); }
.eventDetailRow {
  display:flex; gap:8px; align-items:center;
  font-size:13px; color:#aaa;
}
.eventDetailRow span:first-child { font-size:16px; }
.eventDetailDesc {
  background:#1a1a1a; border:1px solid #222; border-radius:8px;
  padding:12px; font-size:13px; color:#ccc; line-height:1.6;
  min-height:60px;
}
.eventDetailNoDesc { font-size:12px; color:#444; font-style:italic; }
.eventDetailAudienceBadge {
  display:inline-flex; align-items:center; gap:6px;
  background:rgba(212,175,55,0.1); border:1px solid rgba(212,175,55,0.25);
  color:#d4af37; padding:5px 12px; border-radius:20px; font-size:12px;
  width:fit-content;
}
.btnDetailClose {
  background:none; border:1px solid #333; color:#888;
  padding:9px; border-radius:8px; cursor:pointer;
  font-family:Poppins; font-size:13px; transition:0.2s; text-align:center;
}
.btnDetailClose:hover { border-color:#666; color:#fff; }

/* =====================
   CREATE/EDIT MODAL
===================== */
.modalOverlay {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,0.85); z-index:6000;
  justify-content:center; align-items:center; padding:20px;
}
.modalOverlay.active { display:flex; }
.modal {
  background:#111; border:1px solid #2a2a2a;
  border-radius:12px; width:100%; max-width:420px;
  padding:24px; display:flex; flex-direction:column; gap:16px;
}
.modal h3 { color:#d4af37; font-size:16px; }
.modal input, .modal textarea, .modal select {
  width:100%; padding:12px; background:#1e1e1e;
  border:1px solid #2a2a2a; border-radius:8px;
  color:white; font-family:Poppins; font-size:14px;
  resize:none; appearance:none; -webkit-appearance:none;
}
.modal input:focus, .modal textarea:focus, .modal select:focus {
  outline:none; border-color:#d4af37;
}
.selectWrapper { position:relative; }
.selectWrapper::after {
  content:"▾"; position:absolute; right:12px; top:50%;
  transform:translateY(-50%); color:#d4af37;
  pointer-events:none; font-size:14px;
}
.selectWrapper select { padding-right:32px; cursor:pointer; }
.selectWrapper select option { background:#1e1e1e; color:white; }
.fieldLabel { font-size:12px; color:#888; margin-bottom:-10px; padding-left:2px; }
.modalBtns { display:flex; gap:10px; justify-content:flex-end; }
.modalBtns button {
  padding:10px 20px; border-radius:8px; border:none;
  cursor:pointer; font-family:Poppins; font-size:14px; transition:0.2s;
}
.btnCancel { background:#1e1e1e; color:#aaa; border:1px solid #333 !important; }
.btnCancel:hover { border-color:#666 !important; color:#fff; }
.btnSave {
  background:linear-gradient(135deg,#d4af37,#f3d27a);
  color:black; font-weight:600;
}
.btnDelete {
  background:rgba(192,57,43,0.15); color:#e74c3c;
  border:1px solid #c0392b !important;
}
.btnDelete:hover { background:rgba(192,57,43,0.3); }

/* SLIDE MENU */
.slideMenu {
  position:fixed; top:0; left:-320px; width:300px;
  height:100vh; background:#0d0d0d; border-right:1px solid #222;
  transition:left 0.3s ease; z-index:7000;
  display:flex; flex-direction:column;
}
.slideMenu.active { left:0; }
.slideMenuHeader {
  display:flex; justify-content:space-between; align-items:center;
  padding:20px; border-bottom:1px solid #222;
}
.slideMenuHeader span { font-weight:600; color:#d4af37; font-size:15px; }
.slideMenuHeader button {
  background:none; border:1px solid #444; color:#aaa;
  padding:5px 12px; border-radius:6px; cursor:pointer;
  font-size:13px; transition:0.2s;
}
.slideMenuHeader button:hover { border-color:#d4af37; color:#d4af37; }
.slideMenuBody { padding:24px 20px; display:flex; flex-direction:column; gap:12px; }
.slideMenuBtn {
  width:100%; padding:13px 16px; background:transparent;
  border:1px solid #2a2a2a; color:#ccc; border-radius:8px;
  cursor:pointer; font-family:Poppins; font-size:14px;
  text-align:left; display:flex; align-items:center; gap:10px; transition:0.2s;
}
.slideMenuBtn:hover { border-color:#d4af37; color:#d4af37; background:rgba(212,175,55,0.05); }
.slideMenuBtn.danger { border-color:#2a1a1a; color:#c0392b; }
.slideMenuBtn.danger:hover { border-color:#c0392b; background:rgba(192,57,43,0.05); }

/* ASSIGNED TASKS POPUP */
#assignedPopupOverlay {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,0.75); z-index:5500;
  justify-content:center; align-items:center; padding:20px;
}

/* RESPONSIVE */
@media (max-width:767px) {
  .calendarWrapper { margin:20px auto; padding:0 12px 40px; }
  .dayCell { min-height:60px; padding:5px; }
  .eventDot { font-size:9px; padding:1px 3px; }
  .dayNum { font-size:11px; }
  .weekDay { font-size:10px; }
  .monthTitle { font-size:17px; }
}
</style>
</head>
<body>

<div class="overlay" id="overlay" onclick="closeAll()"></div>

<!-- TOP BAR -->
<div class="topBar">
  <button class="hamburgerBtn" onclick="toggleSlideMenu()">
    <span></span><span></span><span></span>
  </button>
  <div class="topTitle">📅 Calendario</div>
  <button class="backBtn" onclick="window.location='index.html'">← Inicio</button>
</div>

<!-- CALENDAR -->
<div class="calendarWrapper">
  <div class="monthHeader">
    <button class="navBtn" onclick="changeMonth(-1)">‹</button>
    <div class="monthTitle" id="monthTitle"></div>
    <button class="navBtn" onclick="changeMonth(1)">›</button>
  </div>
  <div class="weekDays">
    <div class="weekDay">Dom</div><div class="weekDay">Lun</div>
    <div class="weekDay">Mar</div><div class="weekDay">Mié</div>
    <div class="weekDay">Jue</div><div class="weekDay">Vie</div>
    <div class="weekDay">Sáb</div>
  </div>
  <div class="daysGrid" id="daysGrid"></div>
</div>

<!-- ========================
     DAY POPUP
======================== -->
<div class="dayPopupOverlay" id="dayPopupOverlay">
  <div class="dayPopup">
    <div class="dayPopupHeader">
      <div class="dayPopupTitle" id="dayPopupTitle"></div>
      <div class="dayPopupActions">
        <button class="btnAddEvent" onclick="openCreateModal()" title="Nuevo evento">+</button>
        <button class="btnClosePopup" onclick="closeDayPopup()">✕</button>
      </div>
    </div>
    <div class="dayPopupBody" id="dayPopupBody"></div>
  </div>
</div>

<!-- ========================
     EVENT DETAIL
======================== -->
<div class="eventDetailOverlay" id="eventDetailOverlay">
  <div class="eventDetail">
    <div class="eventDetailHeader">
      <div class="eventDetailTitle" id="detailTitle"></div>
      <div class="eventDetailActions">
        <button class="btnDetailEdit" onclick="editFromDetail()">✏️ Editar</button>
        <button class="btnDetailDelete" onclick="deleteFromDetail()">🗑</button>
      </div>
    </div>
    <div class="eventDetailRow" id="detailTime"></div>
    <div id="detailAudience"></div>
    <div id="detailDescWrapper"></div>

</div>

<!-- ========================
     CREATE / EDIT MODAL
======================== -->
<div class="modalOverlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">📝 Nuevo evento</h3>
    <input type="text" id="eventTitle" placeholder="Título del evento">
    <textarea id="eventDesc" rows="3" placeholder="Descripción (opcional)"></textarea>
    <input type="time" id="eventTime">
    <div>
      <div class="fieldLabel">👤 Visible para</div>
      <div class="selectWrapper">
        <select id="eventAudience">
          <option value="all">Todos</option>
          <option value="andrew@tmk-agency.com">Andrew</option>
          <option value="clifton@tmk-agency.com">Clifton</option>
          <option value="fabricio@tmk-agency.com">Fabricio</option>
          <option value="katherinemora@tmk-agency.com">Katherine</option>
          <option value="michelle@tmk-agency.com">Michelle</option>
          <option value="alanys@tmk-agency.com">Alanys</option>
          <option value="breyner@tmk-agency.com">Breyner</option>
          <option value="maria@tmk-agency.com">Maria Jose</option>
          <option value="marcolamugue@tmk-agency.com">Marco</option>
          <option value="danielaalvarez@tmk-agency.com">Daniela</option>
        </select>

    <div class="modalBtns">
      <button class="btnCancel" onclick="closeModal()">Cancelar</button>
      <button class="btnSave" onclick="saveEvent()">Guardar</button>

  </div>
</div>

<!-- SLIDE MENU -->
<div id="slideMenu" class="slideMenu">
  <div class="slideMenuHeader">
    <span>⚙ Opciones</span>
    <button onclick="closeSlideMenu()">✕</button>
  </div>
  <div class="slideMenuBody">
    <button class="slideMenuBtn" onclick="window.location='index.html'">🏠 Inicio / Chat IA</button>
    <button class="slideMenuBtn" id="assignedTasksBtn" style="display:none" onclick="openAssignedTasksPopup();closeSlideMenu()">👥 Ver tareas asignadas</button>
    <button class="slideMenuBtn" onclick="exportEvents();closeSlideMenu()">📊 Exportar eventos del mes</button>
    <button class="slideMenuBtn danger" onclick="logout()">🔓 Cerrar sesión</button>
  </div>
</div>

<!-- ASSIGNED TASKS POPUP -->
<div id="assignedPopupOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:5500;justify-content:center;align-items:center;padding:20px;">
  <div style="background:#111;border:1px solid #2a2a2a;border-radius:12px;width:100%;max-width:520px;max-height:80vh;display:flex;flex-direction:column;overflow:hidden;">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid #2a2a2a;">
      <span style="font-weight:600;color:#d4af37;font-size:16px;">👥 Tareas asignadas</span>
      <button onclick="closeAssignedTasksPopup()" style="background:none;border:1px solid #555;color:#aaa;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:13px;font-family:Poppins;">✕ Cerrar</button>
    </div>
    <div id="assignedTasksList" style="overflow-y:auto;padding:16px;flex:1;"></div>
  </div>
</div>

<script>
const API = "https://jean-paul.onrender.com"

const SUPERVISORS = [
  "marcolamugue@tmk-agency.com",
  "danielaalvarez@tmk-agency.com",
  "fabricio@tmk-agency.com"
]

const USER_NAMES = {
  "andrew@tmk-agency.com":        "Andrew",
  "clifton@tmk-agency.com":       "Clifton",
  "fabricio@tmk-agency.com":      "Fabricio",
  "katherinemora@tmk-agency.com": "Katherine",
  "michelle@tmk-agency.com":      "Michelle",
  "alanys@tmk-agency.com":        "Alanys",
  "breyner@tmk-agency.com":       "Breyner",
  "maria@tmk-agency.com":         "Maria Jose",
  "marcolamugue@tmk-agency.com":  "Marco",
  "danielaalvarez@tmk-agency.com":"Daniela"
}

let userEmail = null
let currentYear, currentMonth
let events = {}
let selectedDate = null
let editingIndex = null
let detailIndex = null  // index being viewed in detail modal

// ======================
// INIT
// ======================
window.onload = () => {
  userEmail = localStorage.getItem("email")
  if(!userEmail){ alert("Debes iniciar sesión"); window.location="login.html"; return }
  if(SUPERVISORS.includes(userEmail))
    document.getElementById("assignedTasksBtn").style.display = "flex"
  loadEvents()
  const now = new Date()
  currentYear = now.getFullYear()
  currentMonth = now.getMonth()
  renderCalendar()
}

// ======================
// STORAGE
// ======================
function eventsKey(){ return "tmk_events_" + userEmail }
function loadEvents(){
  try { const r = localStorage.getItem(eventsKey()); events = r ? JSON.parse(r) : {} }
  catch(e){ events = {} }
}
function saveEvents(){ localStorage.setItem(eventsKey(), JSON.stringify(events)) }

// ======================
// VISIBILITY
// ======================
function isVisible(ev){
  if(!ev.audience || ev.audience === "all") return true
  if(ev.audience === userEmail) return true
  if(SUPERVISORS.includes(userEmail)) return true
  return false
}

// ======================
// CALENDAR RENDER
// ======================
function changeMonth(dir){
  currentMonth += dir
  if(currentMonth > 11){ currentMonth=0; currentYear++ }
  if(currentMonth < 0){ currentMonth=11; currentYear-- }
  renderCalendar()
}

function renderCalendar(){
  const names = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"]
  document.getElementById("monthTitle").innerText = names[currentMonth] + " " + currentYear

  const grid = document.getElementById("daysGrid")
  grid.innerHTML = ""

  const firstDay   = new Date(currentYear, currentMonth, 1).getDay()
  const daysInMonth = new Date(currentYear, currentMonth+1, 0).getDate()
  const daysInPrev  = new Date(currentYear, currentMonth, 0).getDate()
  const now = new Date()
  const todayStr = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`

  for(let i=0; i<firstDay; i++){
    const cell = mkCell("other-month")
    cell.innerHTML = `<div class="dayNum">${daysInPrev-firstDay+i+1}</div>`
    grid.appendChild(cell)
  }

  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${currentYear}-${pad(currentMonth+1)}-${pad(d)}`
    const cell = mkCell(dateStr===todayStr ? "today" : "")
    cell.onclick = () => openDayPopup(dateStr)
    cell.innerHTML = `<div class="dayNum">${d}</div>`

    const visible = (events[dateStr]||[]).filter(isVisible)
    visible.slice(0,3).forEach(ev => {
      const dot = document.createElement("div")
      dot.className = "eventDot"
      dot.innerText = (ev.time ? ev.time+" " : "") + ev.title
      cell.appendChild(dot)
    })
    if(visible.length > 3){
      const m = document.createElement("div")
      m.className = "eventDot"; m.style.color="#888"
      m.innerText = `+${visible.length-3} más`
      cell.appendChild(m)
    }
    grid.appendChild(cell)
  }

  const total = firstDay + daysInMonth
  const rem = total%7===0 ? 0 : 7-(total%7)
  for(let i=1; i<=rem; i++){
    const cell = mkCell("other-month")
    cell.innerHTML = `<div class="dayNum">${i}</div>`
    grid.appendChild(cell)
  }
}

function mkCell(cls){
  const d = document.createElement("div")
  d.className = "dayCell" + (cls ? " "+cls : "")
  return d
}
function pad(n){ return String(n).padStart(2,"0") }

// ======================
// DAY POPUP
// ======================
function openDayPopup(dateStr){
  selectedDate = dateStr
  editingIndex = null

  const [y,m,d] = dateStr.split("-")
  const date = new Date(y, m-1, d)
  const label = date.toLocaleDateString("es-CR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})

  document.getElementById("dayPopupTitle").innerText = "📅 " + label

  renderDayPopupBody()
  document.getElementById("dayPopupOverlay").classList.add("active")
}

function renderDayPopupBody(){
  const body = document.getElementById("dayPopupBody")
  body.innerHTML = ""

  const visible = (events[selectedDate]||[])
    .map((ev,i) => ({ev, i}))
    .filter(({ev}) => isVisible(ev))

  if(visible.length === 0){
    body.innerHTML = `<div class="noEventsMsg">No hay eventos para este día.<br><span style="font-size:12px;color:#444;">Presiona + para agregar uno.</span></div>`
    return
  }

  visible.forEach(({ev, i}) => {
    const card = document.createElement("div")
    card.className = "eventCard"
    card.onclick = () => openEventDetail(i)

    const audienceLabel = (!ev.audience || ev.audience==="all")
      ? "Todos" : (USER_NAMES[ev.audience] || ev.audience)

    card.innerHTML = `
      <div class="eventCardTitle">${ev.title}</div>
      <div class="eventCardMeta">
        ${ev.time ? `<div class="eventCardTime">🕐 ${ev.time}</div>` : ""}
        <div class="eventCardAudience">👤 ${audienceLabel}</div>
      </div>
    `
    body.appendChild(card)
  })
}

function closeDayPopup(){
  document.getElementById("dayPopupOverlay").classList.remove("active")
  selectedDate = null
  editingIndex = null
}

// ======================
// EVENT DETAIL
// ======================
function openEventDetail(idx){
  detailIndex = idx
  const ev = events[selectedDate][idx]

  document.getElementById("detailTitle").innerText = ev.title

  const timeEl = document.getElementById("detailTime")
  timeEl.innerHTML = ev.time
    ? `<span>🕐</span><span>${ev.time}</span>`
    : `<span>🕐</span><span style="color:#444">Sin hora</span>`

  const audienceLabel = (!ev.audience || ev.audience==="all")
    ? "Todos" : (USER_NAMES[ev.audience] || ev.audience)

  document.getElementById("detailAudience").innerHTML =
    `<div class="eventDetailAudienceBadge">👤 ${audienceLabel}</div>`

  const descW = document.getElementById("detailDescWrapper")
  if(ev.desc && ev.desc.trim()){
    descW.innerHTML = `<div class="eventDetailDesc">${ev.desc.replace(/\n/g,"<br>")}</div>`
  } else {
    descW.innerHTML = `<div class="eventDetailNoDesc">Sin descripción.</div>`
  }

  document.getElementById("eventDetailOverlay").classList.add("active")
}

function closeEventDetail(){
  document.getElementById("eventDetailOverlay").classList.remove("active")
  detailIndex = null
}

function editFromDetail(){
  closeEventDetail()
  openEditModal(detailIndex)
}

function deleteFromDetail(){
  if(detailIndex===null || !events[selectedDate]) return
  if(!confirm("¿Eliminar este evento?")) return
  events[selectedDate].splice(detailIndex, 1)
  if(events[selectedDate].length===0) delete events[selectedDate]
  saveEvents()
  renderCalendar()
  renderDayPopupBody()
  closeEventDetail()
}

// ======================
// CREATE / EDIT MODAL
// ======================
function openCreateModal(){
  editingIndex = null
  document.getElementById("modalTitle").innerText = "📝 Nuevo evento"
  document.getElementById("eventTitle").value = ""
  document.getElementById("eventDesc").value = ""
  document.getElementById("eventTime").value = ""
  document.getElementById("eventAudience").value = "all"
  document.getElementById("modalOverlay").classList.add("active")
  setTimeout(() => document.getElementById("eventTitle").focus(), 100)
}

function openEditModal(idx){
  editingIndex = idx
  const ev = events[selectedDate][idx]
  document.getElementById("modalTitle").innerText = "✏️ Editar evento"
  document.getElementById("eventTitle").value = ev.title || ""
  document.getElementById("eventDesc").value = ev.desc || ""
  document.getElementById("eventTime").value = ev.time || ""
  document.getElementById("eventAudience").value = ev.audience || "all"
  document.getElementById("modalOverlay").classList.add("active")
  setTimeout(() => document.getElementById("eventTitle").focus(), 100)
}

function closeModal(){
  document.getElementById("modalOverlay").classList.remove("active")
}

function saveEvent(){
  const title = document.getElementById("eventTitle").value.trim()
  if(!title){ alert("Escribe un título"); return }

  const ev = {
    title,
    desc:     document.getElementById("eventDesc").value.trim(),
    time:     document.getElementById("eventTime").value,
    audience: document.getElementById("eventAudience").value
  }

  if(!events[selectedDate]) events[selectedDate] = []

  if(editingIndex !== null){
    events[selectedDate][editingIndex] = ev
  } else {
    events[selectedDate].push(ev)
  }

  saveEvents()
  renderCalendar()
  renderDayPopupBody()
  closeModal()
}

document.getElementById("modalOverlay").addEventListener("click", function(e){
  if(e.target===this) closeModal()
})
document.getElementById("dayPopupOverlay").addEventListener("click", function(e){
  if(e.target===this) closeDayPopup()
})
document.getElementById("eventDetailOverlay").addEventListener("click", function(e){
  if(e.target===this) closeEventDetail()
})

// ======================
// EXPORT
// ======================
function exportEvents(){
  const names = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"]
  const monthName = names[currentMonth]
  const prefix = `${currentYear}-${pad(currentMonth+1)}`

  const monthEvents = Object.entries(events)
    .filter(([d]) => d.startsWith(prefix))
    .sort(([a],[b]) => a.localeCompare(b))

  if(monthEvents.length===0){ alert("No hay eventos en este mes."); return }

  let csv = `Eventos — ${monthName} ${currentYear}\nUsuario,${userEmail}\n\nFecha,Hora,Título,Descripción,Visible Para\n`
  monthEvents.forEach(([date,evs]) => {
    evs.forEach(ev => {
      const lbl = (!ev.audience||ev.audience==="all") ? "Todos" : (USER_NAMES[ev.audience]||ev.audience)
      csv += `${date},${ev.time||"—"},"${ev.title.replace(/"/g,'""')}","${(ev.desc||"").replace(/"/g,'""')}","${lbl}"\n`
    })
  })

  const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8;"})
  const url = URL.createObjectURL(blob)
  const a = document.createElement("a")
  a.href=url; a.download=`calendario_${monthName}_${currentYear}_${userEmail.split("@")[0]}.csv`
  a.click(); URL.revokeObjectURL(url)
}

// ======================
// SLIDE MENU
// ======================
function toggleSlideMenu(){
  const m = document.getElementById("slideMenu")
  const open = m.classList.contains("active")
  closeAll()
  if(!open){ m.classList.add("active"); document.getElementById("overlay").classList.add("active") }
}
function closeSlideMenu(){
  document.getElementById("slideMenu").classList.remove("active")
  document.getElementById("overlay").classList.remove("active")
}
function closeAll(){
  document.getElementById("slideMenu").classList.remove("active")
  document.getElementById("overlay").classList.remove("active")
}

// ======================
// ASSIGNED TASKS POPUP
// ======================
async function openAssignedTasksPopup(){
  document.getElementById("assignedPopupOverlay").style.display = "flex"
  document.getElementById("assignedTasksList").innerHTML = "<p style='color:#888;text-align:center;padding:20px;'>Cargando...</p>"
  try {
    const res = await fetch(API+"/get-assigned-tasks",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({email:userEmail})
    })
    const data = await res.json()
    const list = document.getElementById("assignedTasksList")
    list.innerHTML = ""
    if(!data.tasks||data.tasks.length===0){
      list.innerHTML = "<p style='color:#888;text-align:center;padding:20px;'>No has asignado tareas aún.</p>"
      return
    }
    const grouped = {}
    data.tasks.forEach(t => {
      if(!grouped[t.assigned_to]) grouped[t.assigned_to]=[]
      grouped[t.assigned_to].push(t)
    })
    Object.entries(grouped).forEach(([email,tasks])=>{
      const uName = email.split("@")[0]
      const done = tasks.filter(t=>t.completed).length
      const sec = document.createElement("div")
      sec.style.cssText = "margin-bottom:20px;"
      sec.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #2a2a2a;">
          <span style="font-weight:600;color:#d4af37;font-size:15px;">👤 ${uName}</span>
          <span style="font-size:12px;color:#888;">${done}/${tasks.length} completadas</span>
        </div>`
      tasks.forEach(t=>{
        const item = document.createElement("div")
        item.style.cssText=`display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;margin-bottom:8px;background:${t.completed?'#1a2a1a':'#1e1e1e'};border-left:3px solid ${t.completed?'#4caf50':'#d4af37'};`
        item.innerHTML=`
          <span style="font-size:16px;">${t.completed?'✅':'⏳'}</span>
          <div style="flex:1;">
            <div style="font-size:13px;color:${t.completed?'#888':'#fff'};${t.completed?'text-decoration:line-through;':''}">${t.task}</div>
            <div style="font-size:11px;color:#555;margin-top:2px;">${t.date}</div>
          </div>
          <span style="font-size:11px;padding:3px 8px;border-radius:12px;background:${t.completed?'#1f3a1f':'#2a2200'};color:${t.completed?'#4caf50':'#d4af37'};">${t.completed?'Completada':'Pendiente'}</span>`
        sec.appendChild(item)
      })
      list.appendChild(sec)
    })
  } catch(err){
    document.getElementById("assignedTasksList").innerHTML="<p style='color:red;text-align:center;padding:20px;'>Error cargando tareas.</p>"
  }
}
function closeAssignedTasksPopup(){
  document.getElementById("assignedPopupOverlay").style.display="none"
}
document.addEventListener("click", e=>{
  const ov = document.getElementById("assignedPopupOverlay")
  if(e.target===ov) closeAssignedTasksPopup()
})
